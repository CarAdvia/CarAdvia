<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppression du compte - CarAdvia</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
      text-align: center;
    }

    .box {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 30px;
    }

    .loading {
      font-size: 18px;
    }

    .success {
      color: #15803d;
      font-size: 20px;
    }

    .error {
      color: #b91c1c;
      font-size: 18px;
    }

    a {
      color: #2563eb;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>CarAdvia</h1>

    <p id="message" class="loading">
      Vérification de votre demande...
    </p>
  </div>

  <script>
    const SUPABASE_FUNCTION_URL =
      "https://TON-PROJET.supabase.co/functions/v1/confirm-account-deletion";

    async function confirmDeletion() {
      const params = new URLSearchParams(
        window.location.search
      );

      const token = params.get("token");

      const message =
        document.getElementById("message");

      if (!token) {
        message.className = "error";
        message.textContent =
          "Lien de confirmation invalide.";
        return;
      }

      try {
        const response = await fetch(
          SUPABASE_FUNCTION_URL,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              token: token
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error ||
            "Impossible de supprimer le compte."
          );
        }

        message.className = "success";
        message.textContent =
          "Votre compte CarAdvia a été supprimé définitivement.";

      } catch (error) {
        console.error(error);

        message.className = "error";
        message.textContent =
          error.message ||
          "Une erreur est survenue.";
      }
    }

    confirmDeletion();
  </script>

</body>
</html>
