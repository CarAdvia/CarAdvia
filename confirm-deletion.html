; } .links a { color: var(--primary); text-decoration: none; margin: 0 8px; font-weight: 600; } .links a:hover { text-decoration: underline; } .back { display: inline-block; margin-top: 25px; padding: 12px 20px; background: var(--secondary); color: var(--foreground); border-radius: 10px; text-decoration: none; font-weight: 700; } footer { padding: 25px 20px; background: var(--primary); border-top: 4px solid var(--secondary); color: white; text-align: center; } footer a { color: white; text-decoration: none; margin: 0 8px; font-size: 14px; } footer a:hover { color: var(--secondary); } @media (max-width: 700px) { header { padding: 18px 16px; } .header-inner { flex-direction: column; } nav { justify-content: center; text-align: center; } main { padding: 25px 14px; } .container { padding: 32px 20px; border-radius: 14px; } h1 { font-size: 27px; } .links a { display: block; margin: 10px 0; } } @media (prefers-color-scheme: dark) { :root { --background: hsl(220, 25%, 8%); --foreground: hsl(220, 15%, 93%); --card: hsl(220, 25%, 12%); --primary: hsl(40, 96%, 53%); --secondary: hsl(215, 50%, 23%); --muted-foreground: hsl(220, 10%, 65%); --border: hsl(220, 20%, 20%); } header { background: hsl(220, 25%, 6%); border-bottom-color: hsl(40, 96%, 53%); } .brand, nav a { color: white; } nav a:hover { color: hsl(40, 96%, 53%); } h1 { color: hsl(40, 96%, 53%); } .icon { background: hsl(40, 96%, 53%); color: hsl(220, 30%, 10%); } .links a { color: hsl(40, 96%, 53%); } .back { background: hsl(40, 96%, 53%); color: hsl(220, 30%, 10%); } footer { background: hsl(220, 25%, 6%); border-top-color: hsl(40, 96%, 53%); } } </style>

<script> const SUPABASE_FUNCTION_URL = "https://tsedkhhqiwhgkuqiocrd.supabase.co/functions/v1/confirm-account-deletion"; async function confirmDeletion() { const params = new URLSearchParams( window.location.search ); const token = params.get("token"); const message = document.getElementById("message"); if (!token) { message.className = "error"; message.textContent = "Lien de confirmation invalide."; return; } try { const response = await fetch( SUPABASE_FUNCTION_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token }) } ); const data = await response.json(); if (!response.ok || !data.success) { throw new Error( data.error || "Impossible de supprimer le compte." ); } message.className = "success"; message.textContent = "Votre compte CarAdvia a été supprimé définitivement."; } catch (error) { console.error(error); message.className = "error"; message.textContent = error.message || "Une erreur est survenue."; } } confirmDeletion(); </script>
